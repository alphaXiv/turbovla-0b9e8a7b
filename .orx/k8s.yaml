apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: turbovla-eff-{{ORX_RUN}}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: shared-vast
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: turbovla-eff-{{ORX_RUN}}
  labels:
    app: turbovla-efficiency
spec:
  completions: 16
  parallelism: 16
  completionMode: Indexed
  backoffLimit: 0
  activeDeadlineSeconds: 36000
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app: turbovla-efficiency
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: nvcr.io/nvidia/pytorch:25.06-py3
          command: ["bash", "-c", "bash -c \"$ORX_SCRIPT\""]
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: TURBOVLA_RESULTS_DIR
              value: /orx-results
            - name: TURBOVLA_EXPECTED_PODS
              value: "16"
            - name: TURBOVLA_EXPECTED_GPUS_PER_POD
              value: "1"
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: 32Gi
              ephemeral-storage: 10Gi
            limits:
              nvidia.com/gpu: "1"
              cpu: "16"
              memory: 64Gi
              ephemeral-storage: 20Gi
          volumeMounts:
            - name: results
              mountPath: /orx-results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: turbovla-eff-{{ORX_RUN}}
