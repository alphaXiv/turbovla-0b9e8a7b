<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420">
  <rect width="820" height="420" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">Sustained model throughput clears the 32 Hz target</text>
  <text x="410" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Eight independent one-GPU replicas; paper number is a hardware reference, not a matched comparison</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="205" y1="70" x2="205" y2="345"/>
    <line x1="312" y1="70" x2="312" y2="345"/>
    <line x1="419" y1="70" x2="419" y2="345"/>
    <line x1="526" y1="70" x2="526" y2="345"/>
    <line x1="633" y1="70" x2="633" y2="345"/>
    <line x1="740" y1="70" x2="740" y2="345"/>
  </g>
  <line x1="205" y1="345" x2="740" y2="345" stroke="#333" stroke-width="1.5"/>
  <line x1="376" y1="66" x2="376" y2="345" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="382" y="80" font-family="sans-serif" font-size="11" fill="#991b1b">32 Hz real-time target</text>
  <g font-family="sans-serif" font-size="13" fill="#222">
    <text x="192" y="112" text-anchor="end">Paper, RTX 4090</text>
    <text x="192" y="177" text-anchor="end">N6 / 256, 1M steps</text>
    <text x="192" y="242" text-anchor="end">N2 / 448, 150k steps</text>
    <text x="192" y="307" text-anchor="end">N6 / 512, 300k steps</text>
  </g>
  <rect x="205" y="89" width="172" height="34" rx="4" fill="#9ca3af"/>
  <rect x="205" y="154" width="433" height="34" rx="4" fill="#2563eb"/>
  <rect x="205" y="219" width="519" height="34" rx="4" fill="#059669"/>
  <rect x="205" y="284" width="425" height="34" rx="4" fill="#2563eb"/>
  <g font-family="sans-serif" font-size="13" font-weight="bold">
    <text x="387" y="111" fill="#374151">32.1 Hz</text>
    <text x="648" y="176" fill="#1e3a8a">81.0 Hz</text>
    <text x="712" y="241" text-anchor="end" fill="#ffffff">97.0 Hz</text>
    <text x="640" y="306" fill="#1e3a8a">79.5 Hz</text>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#555">
    <text x="205" y="365" text-anchor="middle">0</text>
    <text x="312" y="365" text-anchor="middle">20</text>
    <text x="419" y="365" text-anchor="middle">40</text>
    <text x="526" y="365" text-anchor="middle">60</text>
    <text x="633" y="365" text-anchor="middle">80</text>
    <text x="740" y="365" text-anchor="middle">100</text>
    <text x="472" y="395" text-anchor="middle" font-size="13">Model forwards per second (higher is better)</text>
  </g>
</svg>
