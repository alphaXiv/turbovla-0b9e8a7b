    <text x="600" y="101" fill="#1e3a8a">12.349</text>
    <text x="255" y="221" text-anchor="end" fill="#065f46">N2/512 10.412</text>
    <text x="600" y="247" fill="#065f46">10.165</text>
    <text x="255" y="61" text-anchor="end" fill="#5b21b6">N6/512 13.031</text>
