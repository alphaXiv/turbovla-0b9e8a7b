  <text x="410" y="49" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Points are eight-replica medians; lines join matched configurations</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="95" y1="315" x2="760" y2="315"/>
    <line x1="95" y1="253" x2="760" y2="253"/>
    <line x1="95" y1="191" x2="760" y2="191"/>
    <line x1="95" y1="129" x2="760" y2="129"/>
    <line x1="95" y1="67" x2="760" y2="67"/>
  </g>
  <line x1="95" y1="315" x2="760" y2="315" stroke="#333" stroke-width="1.5"/>
  <line x1="95" y1="67" x2="95" y2="315" stroke="#333" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="12" fill="#444">
    <text x="80" y="319" text-anchor="end">9</text>
    <text x="80" y="257" text-anchor="end">10</text>
    <text x="80" y="195" text-anchor="end">11</text>
    <text x="80" y="133" text-anchor="end">12</text>
    <text x="80" y="71" text-anchor="end">13</text>
    <text x="275" y="337" text-anchor="middle">Short control</text>
    <text x="580" y="337" text-anchor="middle">Sustained run</text>
