  </g>
  <g fill="none" stroke-width="3">
    <line x1="275" y1="108" x2="580" y2="107" stroke="#2563eb"/>
    <line x1="275" y1="227" x2="580" y2="243" stroke="#059669"/>
    <line x1="275" y1="65" x2="580" y2="93" stroke="#7c3aed"/>
  </g>
  <g stroke="#fff" stroke-width="2">
    <circle cx="275" cy="108" r="7" fill="#2563eb"/><circle cx="580" cy="107" r="7" fill="#2563eb"/>
    <circle cx="275" cy="227" r="7" fill="#059669"/><circle cx="580" cy="243" r="7" fill="#059669"/>
    <circle cx="275" cy="65" r="7" fill="#7c3aed"/><circle cx="580" cy="93" r="7" fill="#7c3aed"/>
  </g>
  <g font-family="sans-serif" font-size="11" font-weight="bold">
