<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
  <rect width="820" height="430" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">GPU timing is stable; wall timing is contention-sensitive</text>
  <text x="410" y="49" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Horizontal segments show the minimum-to-maximum replica median in successful endurance runs</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="205" y1="70" x2="205" y2="350"/>
    <line x1="311" y1="70" x2="311" y2="350"/>
    <line x1="417" y1="70" x2="417" y2="350"/>
    <line x1="523" y1="70" x2="523" y2="350"/>
    <line x1="629" y1="70" x2="629" y2="350"/>
    <line x1="735" y1="70" x2="735" y2="350"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#222">
    <text x="190" y="112" text-anchor="end">N6 / 256</text>
    <text x="190" y="212" text-anchor="end">N2 / 512</text>
    <text x="190" y="312" text-anchor="end">N6 / 512</text>
  </g>
  <g stroke-linecap="round">
    <line x1="270" y1="95" x2="273" y2="95" stroke="#2563eb" stroke-width="9"/>
    <line x1="284" y1="125" x2="614" y2="125" stroke="#f59e0b" stroke-width="9"/>
    <line x1="258" y1="195" x2="266" y2="195" stroke="#2563eb" stroke-width="9"/>
    <line x1="278" y1="225" x2="687" y2="225" stroke="#f59e0b" stroke-width="9"/>
    <line x1="270" y1="295" x2="281" y2="295" stroke="#2563eb" stroke-width="9"/>
    <line x1="315" y1="325" x2="675" y2="325" stroke="#f59e0b" stroke-width="9"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#444">
    <text x="284" y="99">GPU 12.23–12.79 ms</text>
    <text x="620" y="129">wall 14.94–77.26</text>
    <text x="278" y="199">GPU 9.96–11.47</text>
    <text x="679" y="229" text-anchor="end" fill="#ffffff">wall 13.83–90.91</text>
    <text x="293" y="299">GPU 12.31–14.40</text>
    <text x="681" y="329">wall 20.85–88.66</text>
    <text x="205" y="370" text-anchor="middle">0</text>
    <text x="311" y="370" text-anchor="middle">20</text>
    <text x="417" y="370" text-anchor="middle">40</text>
    <text x="523" y="370" text-anchor="middle">60</text>
    <text x="629" y="370" text-anchor="middle">80</text>
    <text x="735" y="370" text-anchor="middle">100</text>
    <text x="470" y="400" text-anchor="middle" font-size="13">Milliseconds (lower and narrower is better)</text>
  </g>
  <g font-family="sans-serif" font-size="12">
    <rect x="555" y="72" width="15" height="8" rx="4" fill="#2563eb"/><text x="578" y="81" fill="#1e3a8a">CUDA model</text>
    <rect x="650" y="72" width="15" height="8" rx="4" fill="#f59e0b"/><text x="673" y="81" fill="#92400e">end-to-end wall</text>
  </g>
</svg>
